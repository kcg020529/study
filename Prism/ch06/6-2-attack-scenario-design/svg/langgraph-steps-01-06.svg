<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
<title id="t">LangGraph 실습 01~06</title><desc id="d">기초 그래프부터 비주얼 대시보드까지</desc>
<style>
  text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
  .bg { fill: #f8fafc; }
  .title { font-size: 24px; font-weight: 700; }
  .sub { font-size: 14px; fill: #64748b; }
  .row { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
  .name { font-size: 16px; font-weight: 700; }
  .desc { font-size: 13px; fill: #475569; }
  .num { font-size: 18px; font-weight: 700; fill: #ffffff; }
</style>
<rect class="bg" width="900" height="500" rx="14"/>
<text class="title" x="30" y="46">LangGraph 실습 01~06</text>
<text class="sub" x="30" y="70">단계가 올라갈수록 상태·제어 흐름이 복잡해진다</text>
<rect class="row" x="30" y="100" width="840" height="50" rx="10"/><circle cx="60" cy="125" r="16" fill="#3b82f6"/><text class="num" x="60" y="131" text-anchor="middle">01</text><text class="name" x="95" y="122">기초 상태 그래프</text><text class="desc" x="95" y="140">State / Node / Edge 세 요소로 선형 그래프 구성</text><rect class="row" x="30" y="162" width="840" height="50" rx="10"/><circle cx="60" cy="187" r="16" fill="#3b82f6"/><text class="num" x="60" y="193" text-anchor="middle">02</text><text class="name" x="95" y="184">ReAct 에이전트</text><text class="desc" x="95" y="202">prebuilt 헬퍼로 도구 호출 여부를 스스로 판단</text><rect class="row" x="30" y="224" width="840" height="50" rx="10"/><circle cx="60" cy="249" r="16" fill="#3b82f6"/><text class="num" x="60" y="255" text-anchor="middle">03</text><text class="name" x="95" y="246">Human-in-the-Loop</text><text class="desc" x="95" y="264">민감한 행동 전 interrupt로 멈추고 사람 승인 대기</text><rect class="row" x="30" y="286" width="840" height="50" rx="10"/><circle cx="60" cy="311" r="16" fill="#3b82f6"/><text class="num" x="60" y="317" text-anchor="middle">04</text><text class="name" x="95" y="308">대화 기억·영속성</text><text class="desc" x="95" y="326">add_messages로 누적, thread_id로 세션 격리</text><rect class="row" x="30" y="348" width="840" height="50" rx="10"/><circle cx="60" cy="373" r="16" fill="#3b82f6"/><text class="num" x="60" y="379" text-anchor="middle">05</text><text class="name" x="95" y="370">Agentic RAG</text><text class="desc" x="95" y="388">질문 분류 + 재검색 루프 + 판정으로 환각 방지</text><rect class="row" x="30" y="410" width="840" height="50" rx="10"/><circle cx="60" cy="435" r="16" fill="#3b82f6"/><text class="num" x="60" y="441" text-anchor="middle">06</text><text class="name" x="95" y="432">비주얼 대시보드</text><text class="desc" x="95" y="450">React Flow + WebSocket으로 그래프 실행을 실시간 시각화</text></svg>
