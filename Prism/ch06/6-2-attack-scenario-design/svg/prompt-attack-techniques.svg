<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 500" width="890" height="500" role="img" aria-labelledby="t d">
<title id="t">Prompt Attack 기법</title><desc id="d">지시와 데이터를 구조적으로 구분하지 못하는 모델 특성을 이용한 7가지 기법</desc>
<style>
  text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
  .bg { fill: #f8fafc; }
  .title { font-size: 24px; font-weight: 700; }
  .sub { font-size: 14px; fill: #64748b; }
  .row { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
  .name { font-size: 16px; font-weight: 700; }
  .desc { font-size: 13px; fill: #475569; }
  .num { font-size: 18px; font-weight: 700; fill: #ffffff; }
</style>
<rect class="bg" width="890" height="500" rx="14"/>
<text class="title" x="30" y="46">Prompt Attack 기법</text>
<text class="sub" x="30" y="70">모델이 지시와 데이터를 구분하지 못한다는 점을 이용한다</text>
<rect class="row" x="30" y="100" width="405" height="78" rx="10"/><circle cx="58" cy="139" r="15" fill="#7c3aed"/><text class="num" x="58" y="145" text-anchor="middle">1</text><text class="name" x="88" y="130">직접 인젝션</text><text class="desc" x="88" y="150">지시 덮어쓰기</text><text class="desc" x="88" y="168">입력에 새 지시를 직접 삽입</text><rect class="row" x="455" y="100" width="405" height="78" rx="10"/><circle cx="483" cy="139" r="15" fill="#7c3aed"/><text class="num" x="483" y="145" text-anchor="middle">2</text><text class="name" x="513" y="130">간접 인젝션</text><text class="desc" x="513" y="150">비신뢰 데이터 경유</text><text class="desc" x="513" y="168">문서·웹·메일에 숨긴 지시가 RAG로 유입</text><rect class="row" x="30" y="192" width="405" height="78" rx="10"/><circle cx="58" cy="231" r="15" fill="#7c3aed"/><text class="num" x="58" y="237" text-anchor="middle">3</text><text class="name" x="88" y="222">다중 세션/멀티턴</text><text class="desc" x="88" y="242">맥락 누적</text><text class="desc" x="88" y="260">여러 턴에 걸쳐 경계를 점진적으로 이동</text><rect class="row" x="455" y="192" width="405" height="78" rx="10"/><circle cx="483" cy="231" r="15" fill="#7c3aed"/><text class="num" x="483" y="237" text-anchor="middle">4</text><text class="name" x="513" y="222">구문 경계 교란</text><text class="desc" x="513" y="242">구분자 혼동</text><text class="desc" x="513" y="260">따옴표·태그·역할 표지를 위조</text><rect class="row" x="30" y="284" width="405" height="78" rx="10"/><circle cx="58" cy="323" r="15" fill="#7c3aed"/><text class="num" x="58" y="329" text-anchor="middle">5</text><text class="name" x="88" y="314">인코딩 변환</text><text class="desc" x="88" y="334">필터 우회</text><text class="desc" x="88" y="352">Base64, 유니코드, 다국어 혼용</text><rect class="row" x="455" y="284" width="405" height="78" rx="10"/><circle cx="483" cy="323" r="15" fill="#7c3aed"/><text class="num" x="483" y="329" text-anchor="middle">6</text><text class="name" x="513" y="314">페이로드 분할</text><text class="desc" x="513" y="334">탐지 분산</text><text class="desc" x="513" y="352">요청을 조각내 모델이 재조합하게 유도</text><rect class="row" x="30" y="376" width="405" height="78" rx="10"/><circle cx="58" cy="415" r="15" fill="#7c3aed"/><text class="num" x="58" y="421" text-anchor="middle">7</text><text class="name" x="88" y="406">역할극/가정 설정</text><text class="desc" x="88" y="426">정책 맥락 이동</text><text class="desc" x="88" y="444">허구·연구·디버그 맥락으로 정책 완화 유도</text><text class="desc" x="30" y="470" style="font-style:italic">기법은 조합해서 쓰임: 간접 인젝션으로 지시 유입 + 인코딩으로 탐지 회피 + 멀티턴으로 도구 실행 유도</text></svg>
