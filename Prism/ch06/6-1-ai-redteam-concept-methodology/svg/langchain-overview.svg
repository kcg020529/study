<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">LangChain 한눈에 보기</title>
  <desc id="d">사용자 질문이 Prompt, Model, Parser를 지나 결과가 되는 LangChain 체인 구조</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2937; }
    .bg { fill: #f8fafc; }
    .title { font-size: 24px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .name { font-size: 17px; font-weight: 700; }
    .role { font-size: 13px; fill: #475569; }
    .code { font-family: Consolas, "Courier New", monospace; font-size: 17px; fill: #0f172a; }
    .pipe { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; fill: #2563eb; }
    .flow { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
    .tip { fill: #2563eb; }
    .c1 { fill: #dbeafe; stroke: #93c5fd; }
    .c2 { fill: #fef3c7; stroke: #fcd34d; }
    .c3 { fill: #dcfce7; stroke: #86efac; }
    .c4 { fill: #ede9fe; stroke: #c4b5fd; }
    .note { font-size: 13px; fill: #334155; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect class="bg" width="900" height="440" rx="14"/>
  <text class="title" x="40" y="52">LangChain 한눈에 보기</text>
  <text class="sub" x="40" y="76">LLM 호출 코드를 부품으로 나누고 | 로 이어 붙이는 프레임워크</text>

  <!-- chain flow -->
  <g>
    <rect class="box" x="40" y="110" width="130" height="86" rx="10"/>
    <text class="name" x="105" y="146" text-anchor="middle">사용자 질문</text>
    <text class="role" x="105" y="170" text-anchor="middle">{user_input}</text>

    <rect class="box c1" x="230" y="110" width="170" height="86" rx="10"/>
    <text class="name" x="315" y="146" text-anchor="middle">Prompt</text>
    <text class="role" x="315" y="170" text-anchor="middle">질문 틀에 변수 채우기</text>

    <rect class="box c2" x="460" y="110" width="170" height="86" rx="10"/>
    <text class="name" x="545" y="146" text-anchor="middle">Model</text>
    <text class="role" x="545" y="170" text-anchor="middle">Gemini / GPT / DeepSeek</text>

    <rect class="box c3" x="690" y="110" width="170" height="86" rx="10"/>
    <text class="name" x="775" y="146" text-anchor="middle">Parser</text>
    <text class="role" x="775" y="170" text-anchor="middle">응답에서 글자만 추출</text>

    <path class="flow" d="M170 153 H222"/><path class="tip" d="M230 153 l-9 -5 v10 z"/>
    <path class="flow" d="M400 153 H452"/><path class="tip" d="M460 153 l-9 -5 v10 z"/>
    <path class="flow" d="M630 153 H682"/><path class="tip" d="M690 153 l-9 -5 v10 z"/>
  </g>

  <!-- code -->
  <rect x="40" y="224" width="820" height="52" rx="10" fill="#0f172a"/>
  <text class="code" x="62" y="257" style="fill:#e2e8f0">chain = prompt | model | parser    <tspan style="fill:#94a3b8"># 앞 출력이 뒤 입력으로 자동 전달 (LCEL)</tspan></text>

  <!-- parts table -->
  <text class="name" x="40" y="318">그 밖의 구성 요소 (개념만 학습)</text>
  <g>
    <rect class="box c4" x="40" y="334" width="190" height="82" rx="10"/>
    <text class="name" x="135" y="362" text-anchor="middle">Chain</text>
    <text class="role" x="135" y="386" text-anchor="middle">여러 작업을 순서대로 연결</text>

    <rect class="box c4" x="250" y="334" width="190" height="82" rx="10"/>
    <text class="name" x="345" y="362" text-anchor="middle">Retriever</text>
    <text class="role" x="345" y="386" text-anchor="middle">문서 검색, 임베딩 저장</text>

    <rect class="box c4" x="460" y="334" width="190" height="82" rx="10"/>
    <text class="name" x="555" y="362" text-anchor="middle">Agent / Tools</text>
    <text class="role" x="555" y="386" text-anchor="middle">도구를 골라 실행</text>

    <rect class="box c4" x="670" y="334" width="190" height="82" rx="10"/>
    <text class="name" x="765" y="362" text-anchor="middle">Memory</text>
    <text class="role" x="765" y="386" text-anchor="middle">대화·작업 상태 관리</text>
  </g>
</svg>
